<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOMB DEFUSAL</title>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--ink:#ece6d4;--dim:#8d887a;--hazard:#e3b616;--red:#e5382d;--grn:#2bd46a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Share Tech Mono','Courier New',monospace;overflow-x:hidden}
body{min-height:100dvh}
.screen{display:none;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.screen.on{display:flex}
h1,h2{font-family:'Staatliches',Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.06em}
h1{font-size:clamp(56px,17vw,92px);line-height:.9}
h2{font-size:34px}
.tag{color:var(--dim);max-width:320px;line-height:1.5;font-size:16px}
.stripe{width:min(300px,80%);height:12px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px);border-radius:2px}
.btn{font:inherit;font-family:'Staatliches',Impact,sans-serif;font-size:26px;letter-spacing:.08em;min-height:60px;min-width:240px;padding:0 28px;border-radius:8px;border:2px solid var(--hazard);background:var(--hazard);color:#111;touch-action:manipulation;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--hazard)}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:30;width:48px;height:48px;border-radius:50%;border:1px solid #444;background:#151518;color:var(--ink);font-size:20px}
.paper{background:#d9d2b8;color:#1d1a12;width:min(340px,100%);padding:22px 20px;border-radius:6px;box-shadow:0 8px 30px #000a;transform:rotate(-1deg);text-align:left}
.paper h2{text-align:center;border-bottom:2px dashed #1d1a12;padding-bottom:8px;margin-bottom:12px;font-size:28px}
.paper ol{margin:0;padding:0;list-style:none;transition:filter .25s}
.paper ol.hid{filter:blur(9px);user-select:none}
.paper li{display:flex;align-items:baseline;gap:10px;padding:8px 0;font-size:24px;font-weight:700}
.paper li small{font-size:13px;font-weight:400;opacity:.75;margin-left:auto}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #000;flex:none;transform:translateY(1px)}
#game{justify-content:flex-start;gap:8px;padding:10px 10px 14px}
#hud{display:flex;gap:8px;width:min(440px,100%);margin-top:50px}
#hud div{flex:1;background:#141417;border:1px solid #2c2c31;border-radius:8px;padding:6px 4px}
#hud small{display:block;font-size:11px;color:var(--dim);letter-spacing:.15em}
#hud b{font-size:24px;font-weight:400}
#hTime.danger{color:var(--red);animation:pulse .5s infinite alternate}
.life{color:var(--hazard);margin:0 3px}.life.off{color:#3a3a3f}
@keyframes pulse{to{opacity:.35}}
#stage{width:100%;max-width:min(440px,calc((100dvh - 150px) * .6));position:relative}
#stage svg{width:100%;height:auto;display:block;touch-action:manipulation}
#stage.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.wire .p{fill:none;stroke-linecap:butt;transition:stroke-dasharray .3s ease-out,stroke-dashoffset .3s ease-out,transform .3s ease-out;pointer-events:none}
.wire .t{stroke-dasharray:50 100}.wire .b{stroke-dasharray:50 100;stroke-dashoffset:-50}
.wire.cut .t{stroke-dasharray:41 100;transform:translateY(-4px)}
.wire.cut .b{stroke-dasharray:41 100;stroke-dashoffset:-59;transform:translateY(4px)}
.wire .hit{fill:none;stroke:rgba(0,0,0,0);stroke-width:27;pointer-events:stroke;cursor:pointer}
.wire.done .hit{pointer-events:none}
.wire{filter:drop-shadow(1px 3px 2px rgba(0,0,0,.55))}
.dbg .wire.target .wo{stroke:#fff}
.bulb{fill:#ffb020;filter:drop-shadow(0 0 8px #ffb020);transition:fill .2s}
.bulb.off{fill:#2a2118;filter:none}
.bulb.green{fill:var(--grn);filter:drop-shadow(0 0 12px var(--grn));animation:glow 1s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 20px var(--grn))}}
#flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:20;transition:opacity .4s}
#flash.on{opacity:.45;transition:none}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,0) scale(.8);padding:12px 22px;font-family:'Staatliches',Impact,sans-serif;font-size:34px;letter-spacing:.08em;border-radius:8px;opacity:0;pointer-events:none;z-index:25;transition:opacity .15s,transform .15s;background:#000d;border:2px solid;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.bad{color:var(--red);border-color:var(--red)}#toast.ok{color:var(--grn);border-color:var(--grn)}
#result{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#result.on{display:flex}
#result h1{font-size:clamp(48px,14vw,76px)}#result.win h1{color:var(--grn);text-shadow:0 0 30px var(--grn)}#result.lose h1{color:var(--red)}
.stat{font-size:24px;line-height:1.6}
.dbgline{font-size:12px;color:var(--dim);display:none}
.dbg .dbgline{display:block}
</style>
</head>
<body>
<button id="mute" aria-label="Mute">🔊</button>
<div id="flash"></div><div id="toast"></div>

<section id="start" class="screen on">
  <div class="stripe"></div>
  <h1>BOMB<br>DEFUSAL</h1>
  <div class="stripe"></div>
  <p class="tag">Find the correct sequence. Cut the wires. Defuse the bomb.</p>
  <button class="btn" id="bStart">START</button>
</section>

<section id="code" class="screen">
  <p class="tag" style="margin:0">STEP 1 — CODE</p>
  <div class="paper">
    <h2>WIRE SEQUENCE</h2>
    <ol id="codeList" class="hid"></ol>
  </div>
  <button class="btn alt" id="bReveal">REVEAL CODE</button>
  <button class="btn" id="bMem">MEMORIZE CODE</button>
</section>

<section id="game" class="screen">
  <div id="hud">
    <div><small>TIME</small><b id="hTime">03:00</b></div>
    <div><small>LIVES</small><b id="hLives"></b></div>
    <div><small>PROGRESS</small><b id="hProg">0 / 4</b></div>
  </div>
  <div class="dbgline" id="dbgLine"></div>
  <div id="stage"></div>
  <div id="result"><h1 id="rTitle"></h1><div class="stat" id="rStat"></div><button class="btn" id="bAgain">TRY AGAIN</button></div>
</section>

<script>
/* ===== GAME LOGIC (no DOM) ===== */
const NAMES = ['RED','GREEN','BLUE','BLACK'];
const COL = {RED:'#d4262b', GREEN:'#27a84a', BLUE:'#2a6fdb', BLACK:'#1e1e22'};
const HL  = {RED:'#ff9a9a', GREEN:'#9bf5b0', BLUE:'#a9cdff', BLACK:'#74747d'};
const LAYOUT = ['RED','RED','RED','BLUE','BLUE','BLUE','BLACK','BLACK','GREEN','GREEN']; // edit to change wire count/colors
const TOTAL = 180, ORD = ['1st','2nd','3rd','4th','5th'];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function generatePuzzle(){
  const n = LAYOUT.length, step = 280/(n-1);
  const wires = shuffle(LAYOUT).map((color,i)=>{
    const tx = 40 + i*step;
    return {id:'wire_'+String(i+1).padStart(2,'0'), color, tx, bx: tx + (Math.random()*14-7), pos:null};
  });
  const seq = shuffle(NAMES).map((c,k)=>{
    const opts = wires.filter(w=>w.color===c), w = opts[Math.random()*opts.length|0];
    w.pos = k+1;
    return {wire:w.id, color:c, nth:opts.indexOf(w)+1, of:opts.length};
  });
  return {wires, seq};
}

/* ===== AUDIO (Web Audio, no files) ===== */
let ac, muted = false;
function tone(f,d,type='sine',v=.15,t0=0,slide){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime+t0, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const SFX = {
  cut:()=>tone(2000,.09,'square',.07,0,300),
  ok:()=>{tone(660,.12,'triangle',.2);tone(880,.2,'triangle',.2,.1)},
  bad:()=>tone(170,.45,'sawtooth',.2,0,60),
  warn:()=>tone(1000,.07,'square',.06),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.2,i*.13)),
  lose:()=>[300,220,150].forEach((f,i)=>tone(f,.32,'sawtooth',.18,i*.22))
};
const vib = p => { try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} };

/* ===== VIEW ===== */
const $ = s => document.querySelector(s);
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); scrollTo(0,0); };
const SVGNS = 'http://www.w3.org/2000/svg';

function screw(x,y){ const a=Math.random()*180|0;
  return `<g transform="rotate(${a} ${x} ${y})"><circle cx="${x}" cy="${y}" r="7" fill="url(#sg)" stroke="#111"/><path d="M${x-5} ${y}h10" stroke="#222" stroke-width="2"/></g>`; }

function boardSVG(w){
  let s = `<svg viewBox="0 0 360 600" xmlns="${SVGNS}" id="bomb"><defs>
  <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#323237"/><stop offset="1" stop-color="#19191c"/></linearGradient>
  <radialGradient id="sg"><stop offset="0" stop-color="#9a9aa0"/><stop offset="1" stop-color="#3a3a3f"/></radialGradient>
  <pattern id="br" width="4" height="3" patternUnits="userSpaceOnUse"><path d="M0 1h4" stroke="#fff" stroke-opacity=".03"/></pattern></defs>
  <rect width="360" height="600" rx="22" fill="url(#cg)" stroke="#4a4a50" stroke-width="2"/><rect width="360" height="600" rx="22" fill="url(#br)"/>
  ${screw(16,16)}${screw(344,16)}${screw(16,584)}${screw(344,584)}${screw(180,100)}
  <g font-family="Share Tech Mono,monospace" fill="#8d887a" font-size="8" letter-spacing="1.5">
   <text x="24" y="24">COUNTDOWN</text><text x="232" y="96" text-anchor="middle">LIFE 1</text><text x="312" y="96" text-anchor="middle">LIFE 2</text>
   <text x="180" y="594" text-anchor="middle">MODEL BD-07 · EVENT PROP · NOT A REAL DEVICE</text></g>
  <rect x="22" y="30" width="152" height="58" rx="6" fill="#0c0c0e" stroke="#555" stroke-width="2"/>
  <rect x="28" y="35" width="140" height="48" rx="3" fill="#220707"/>
  <text id="lcd" x="98" y="72" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="38" fill="#ff3b2f">03:00</text>
  ${[232,312].map((x,i)=>`<circle cx="${x}" cy="58" r="27" fill="#0e0e10" stroke="#5a5a60" stroke-width="3"/><circle id="bulb${i}" class="bulb" cx="${x}" cy="58" r="20"/><ellipse cx="${x-7}" cy="49" rx="6" ry="4" fill="#fff" opacity=".35"/>`).join('')}
  <rect x="12" y="108" width="336" height="468" rx="10" fill="#17502f" stroke="#0b2b19" stroke-width="2"/>
  <g stroke="#4cc27f" stroke-opacity=".28" stroke-width="2" fill="none"><path d="M24 200h60v90h40M336 220h-70v110h-30M24 450h90v-50M336 470h-60v-60h-40M130 250h100M180 190v60"/></g>
  <g fill="#0a0a0a" stroke="#333"><rect x="125" y="318" width="110" height="60" rx="3"/>${Array.from({length:8},(_,i)=>`<rect x="${131+i*13}" y="311" width="5" height="7" fill="#aaa" stroke="none"/><rect x="${131+i*13}" y="378" width="5" height="7" fill="#aaa" stroke="none"/>`).join('')}</g>
  <text x="180" y="352" text-anchor="middle" font-size="9" fill="#777" font-family="Share Tech Mono,monospace">ATX-328P</text>
  <g stroke="#222"><rect x="30" y="250" width="34" height="11" rx="5" fill="#c9b27a"/><rect x="296" y="270" width="34" height="11" rx="5" fill="#c9b27a"/><rect x="40" y="400" width="34" height="11" rx="5" fill="#c9b27a"/><rect x="290" y="400" width="34" height="11" rx="5" fill="#c9b27a"/></g>
  <g fill="#1d2a6b" stroke="#aaa"><circle cx="90" cy="445" r="13"/><circle cx="270" cy="300" r="13"/><circle cx="52" cy="330" r="10"/></g>
  <g fill="#ccc" opacity=".6"><circle cx="90" cy="445" r="6"/><circle cx="270" cy="300" r="6"/></g>
  <rect x="20" y="124" width="320" height="52" rx="5" fill="#242429" stroke="#4a4a50"/><rect x="20" y="524" width="320" height="52" rx="5" fill="#242429" stroke="#4a4a50"/>`;
  w.forEach(k=>{ s += `<circle cx="${k.tx}" cy="146" r="6" fill="url(#sg)"/><circle cx="${k.bx}" cy="554" r="6" fill="url(#sg)"/>`; });
  s += `<g id="wires">`;
  w.forEach(k=>{
    const d = `M${k.tx} 176 C${k.tx} 290 ${k.bx} 410 ${k.bx} 524`;
    let g = `<g class="wire" data-id="${k.id}">`;
    for(const [cls,wd,st,tr] of [['wo',12,'#000',.5],['wb',8,COL[k.color],1],['wh',2,HL[k.color],.8]])
      for(const part of ['t','b'])
        g += `<path class="p ${part} ${cls}" d="${d}" pathLength="100" stroke="${st}" stroke-width="${wd}" stroke-opacity="${tr}" ${cls==='wh'?'transform-origin="0 0"':''}/>`;
    g += `<path class="hit" d="${d}"/><g class="mk"></g></g>`;
    s += g;
  });
  s += `</g>`;
  w.forEach(k=>{ s += `<circle cx="${k.tx}" cy="176" r="5" fill="#b9985a" stroke="#6b5427" style="pointer-events:none"/><circle cx="${k.bx}" cy="524" r="5" fill="#b9985a" stroke="#6b5427" style="pointer-events:none"/>`; });
  return s + `</svg>`;
}

/* ===== STATE / FLOW ===== */
let G = null, timer = null, toastT = null;
const DEBUG = /debug/.test(location.search);

function newGame(){
  clearInterval(timer);
  G = {puzzle:generatePuzzle(), step:0, lives:2, mistakes:0, left:TOTAL, end:0, over:false, done:new Set(), busy:new Set()};
  $('#result').classList.remove('on','win','lose');
  $('#codeList').innerHTML = G.puzzle.seq.map((s,i)=>
    `<li><span class="dot" style="background:${COL[s.color]}"></span>${i+1}. ${s.color}<small>${ORD[s.nth-1]} of ${s.of} · left→right</small></li>`).join('');
  $('#codeList').classList.add('hid'); $('#bReveal').textContent = 'REVEAL CODE';
  show('code');
}

function startDefuse(){
  const {wires, seq} = G.puzzle;
  $('#stage').innerHTML = boardSVG(wires);
  document.body.classList.toggle('dbg', DEBUG);
  if(DEBUG){ $('#dbgLine').textContent = seq.map(s=>s.wire+'('+s.color+')').join(' → ');
    const mark = () => { document.querySelectorAll('.wire').forEach(e=>e.classList.toggle('target', G.puzzle.seq[G.step] && e.dataset.id===G.puzzle.seq[G.step].wire)); }; G.mark = mark; mark(); }
  updateHud(); show('game');
  G.end = Date.now() + TOTAL*1000;
  clearInterval(timer); timer = setInterval(tick, 200);
}

function updateHud(){
  $('#hLives').innerHTML = [0,1].map(i=>`<span class="life ${i<G.lives?'':'off'}">●</span>`).join('');
  $('#hProg').textContent = G.step+' / '+G.puzzle.seq.length;
  $('#hTime').textContent = fmt(G.left); const l=$('#lcd'); if(l) l.textContent = fmt(G.left);
  $('#hTime').classList.toggle('danger', G.left<=10 && !G.over);
}

function tick(){
  if(G.over) return;
  const left = Math.max(0, Math.ceil((G.end-Date.now())/1000));
  if(left!==G.left){ G.left = left; updateHud(); if(left<=10 && left>0) SFX.warn(); }
  if(left===0) finish('time');
}

function toast(txt, kind){
  const t=$('#toast'); t.textContent=txt; t.className='show '+kind; clearTimeout(toastT);
  toastT=setTimeout(()=>t.className='',900);
}

function setMark(el, kind){
  const path = el.querySelector('.hit'), p = path.getPointAtLength(path.getTotalLength()/2);
  el.querySelector('.mk').innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="9" fill="#000" stroke="${kind==='ok'?'#2bd46a':'#e5382d'}" stroke-width="2"/><text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="13" font-weight="bold" fill="${kind==='ok'?'#2bd46a':'#e5382d'}" style="pointer-events:none">${kind==='ok'?'✓':'✕'}</text>`;
}

function cutWire(id){
  if(!G || G.over || G.done.has(id) || G.busy.has(id)) return;
  const el = document.querySelector(`.wire[data-id="${id}"]`);
  el.classList.add('cut'); SFX.cut();
  const ok = G.puzzle.seq[G.step].wire === id;   // checks the individual wire, not the color
  if(ok){
    G.done.add(id); el.classList.add('done'); setMark(el,'ok');
    G.step++; SFX.ok(); vib(30); toast('CORRECT','ok'); updateHud(); G.mark && G.mark();
    if(G.step === G.puzzle.seq.length) finish('win');
  } else {
    G.busy.add(id); G.lives--; G.mistakes++;
    $('#bulb'+G.lives).classList.add('off'); setMark(el,'bad');
    SFX.bad(); vib([80,40,80]); toast('WRONG WIRE','bad');
    $('#flash').classList.add('on'); setTimeout(()=>$('#flash').classList.remove('on'),60);
    const st=$('#stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
    updateHud();
    // wrong wire is re-spliced after the snip so later steps stay solvable; the ✕ tag stays as "already tried"
    setTimeout(()=>{ if(!G.done.has(id)) el.classList.remove('cut'); G.busy.delete(id); }, 700);
    if(G.lives<=0) finish('lives');
  }
}

function finish(kind){
  G.over = true; clearInterval(timer);
  const used = TOTAL - G.left, r = $('#result');
  updateHud();
  if(kind==='win'){
    document.querySelectorAll('.bulb').forEach(b=>{b.classList.remove('off');b.classList.add('green')});
    SFX.win(); vib([60,40,60,40,150]);
    $('#rTitle').textContent='BOMB DEFUSED';
    $('#rStat').innerHTML=`TIME: ${fmt(used)}<br>MISTAKES: ${G.mistakes}`; r.classList.add('win');
  } else {
    SFX.lose(); vib(300);
    $('#rTitle').textContent = kind==='time' ? 'GAME OVER' : 'DEFUSED FAILED';
    $('#rStat').innerHTML = kind==='time' ? 'TIME EXPIRED' : 'Both bulbs are out.'; r.classList.add('lose');
  }
  setTimeout(()=>r.classList.add('on'), kind==='win'?1100:700);
}

/* ===== EVENTS ===== */
$('#bStart').onclick = newGame;
$('#bAgain').onclick = newGame;
$('#bMem').onclick = startDefuse;
$('#bReveal').onclick = () => { const h=$('#codeList').classList.toggle('hid'); $('#bReveal').textContent = h?'REVEAL CODE':'HIDE CODE'; };
$('#mute').onclick = () => { muted=!muted; $('#mute').textContent = muted?'🔇':'🔊'; };
$('#stage').addEventListener('pointerdown', e => {
  const w = e.target.closest('.wire'); if(w){ e.preventDefault(); cutWire(w.dataset.id); }
});
</script>
</body>
</html>
